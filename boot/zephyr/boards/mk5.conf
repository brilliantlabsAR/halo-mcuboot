# Bluetooth Configuration
CONFIG_BT=y
CONFIG_BT_CUSTOM=y

CONFIG_LOG=n

# OTA Configuration
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=517

# Flash Configuration
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH=y

# LED Configuration
CONFIG_PWM=y
CONFIG_LED_PWM=y

# Enable MCUBOOT Bootloader
CONFIG_HALO=y

# MCUBOOT Configuration
CONFIG_BOOT_MAX_IMG_SECTORS=843
CONFIG_MCUBOOT_INDICATION_LED=y
CONFIG_BOOT_BLE_DFU_ENTRANCE_GPIO=y

CONFIG_REGULATOR_TPS65132=y
CONFIG_BOOT_BANNER=n
CONFIG_I2S_SYNC=n
